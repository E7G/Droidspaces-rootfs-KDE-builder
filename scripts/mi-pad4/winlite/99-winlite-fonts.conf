<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Keep the font payload tiny while covering the names most Windows apps
       hard-code. Liberation supplies metrically compatible Latin fonts and
       WenQuanYi Zen Hei supplies Simplified/Traditional Chinese glyphs. -->
  <alias>
    <family>Arial</family>
    <prefer><family>Liberation Sans</family></prefer>
  </alias>
  <alias>
    <family>Arial Unicode MS</family>
    <prefer><family>WenQuanYi Zen Hei</family><family>Liberation Sans</family></prefer>
  </alias>
  <alias>
    <family>Tahoma</family>
    <prefer><family>Liberation Sans</family></prefer>
  </alias>
  <alias>
    <family>Segoe UI</family>
    <prefer><family>Liberation Sans</family><family>WenQuanYi Zen Hei</family></prefer>
  </alias>
  <alias>
    <family>Times New Roman</family>
    <prefer><family>Liberation Serif</family></prefer>
  </alias>
  <alias>
    <family>Courier New</family>
    <prefer><family>Liberation Mono</family></prefer>
  </alias>
  <alias>
    <family>Microsoft YaHei</family>
    <prefer><family>WenQuanYi Zen Hei</family></prefer>
  </alias>
  <alias>
    <family>Microsoft YaHei UI</family>
    <prefer><family>WenQuanYi Zen Hei</family></prefer>
  </alias>
  <alias>
    <family>SimSun</family>
    <prefer><family>WenQuanYi Zen Hei</family></prefer>
  </alias>
  <alias>
    <family>NSimSun</family>
    <prefer><family>WenQuanYi Zen Hei</family></prefer>
  </alias>
  <alias>
    <family>SimHei</family>
    <prefer><family>WenQuanYi Zen Hei</family></prefer>
  </alias>

  <!-- Grayscale antialiasing is rotation-safe on the Mi Pad 4. Avoid forcing
       RGB/BGR subpixel order because Android display rotation can swap it. -->
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
  </match>
</fontconfig>
