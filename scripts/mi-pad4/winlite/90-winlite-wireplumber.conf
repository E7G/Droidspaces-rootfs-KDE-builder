# WinLite receives its playback/capture endpoints from the AnLand KWin backend.
# Keep WirePlumber only as a tiny policy/link manager: do not probe container
# hardware, Bluetooth, MIDI or camera devices, and do not depend on logind/D-Bus.
wireplumber.profiles = {
  main = {
    monitor.alsa = disabled
    monitor.alsa-midi = disabled
    monitor.bluez = disabled
    monitor.bluez-midi = disabled
    monitor.v4l2 = disabled
    monitor.libcamera = disabled
    support.dbus = disabled
    support.logind = disabled
  }
}
