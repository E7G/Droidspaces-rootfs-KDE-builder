# WinLite receives playback/capture endpoints from the AnLand KWin backend.
# The session starts WirePlumber with --profile=policy, which has no hardware
# monitors. Keep these overrides as a second line of defense and as a safe
# fallback if the profile selection is ever changed.
wireplumber.profiles = {
  main = {
    monitor.alsa = disabled
    monitor.alsa-midi = disabled
    monitor.bluez = disabled
    monitor.bluez-midi = disabled
    monitor.v4l2 = disabled
    monitor.libcamera = disabled
    support.dbus = disabled
    support.logind = disabled
    support.portal-permissionstore = disabled
    support.reserve-device = disabled
  }
  policy = {
    support.dbus = disabled
    support.logind = disabled
    support.portal-permissionstore = disabled
    support.reserve-device = disabled
  }
}
