# Mi Pad 4 SDM660 / 4 GiB profile. This is deliberately not a generic
# CachyOS profile: Android owns the same RAM and the guest uses the old BFQ
# eMMC path plus a 3 GiB zram device. Keep interactive anonymous pages in RAM
# longer, but make zram use single-page requests when reclaim is unavoidable.
vm.swappiness = 35
vm.vfs_cache_pressure = 75
vm.dirty_bytes = 16777216
vm.dirty_background_bytes = 4194304
vm.dirty_writeback_centisecs = 3000
vm.dirty_expire_centisecs = 3000
vm.page-cluster = 0
kernel.nmi_watchdog = 0
kernel.unprivileged_userns_clone = 1
kernel.printk = 3 3 3 3
kernel.kptr_restrict = 2
net.core.netdev_max_backlog = 4096
fs.file-max = 131072
fs.inotify.max_user_instances = 128
