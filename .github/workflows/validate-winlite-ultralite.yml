name: Validate WinLite UltraLite

on:
  pull_request:
    paths:
      - 'Arch-WinLite.Dockerfile'
      - 'scripts/mi-pad4/winlite/**'
      - 'scripts/mi-pad4/anland-kwin/**'
      - 'scripts/mi-pad4/mi-pad4-kwin-wayland-wrapper'
      - '.github/workflows/build-arch-mi-pad4-winlite.yml'
      - '.github/workflows/validate-winlite-ultralite.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject whitespace errors
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${{ github.base_ref }}" ]]; then
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          else
            git diff --check HEAD~1..HEAD
          fi

      - name: Validate WinLite shell syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/mi-pad4/winlite/droidspaces-init
          bash -n scripts/mi-pad4/winlite/build-kwin-bridge.sh
          bash -n scripts/mi-pad4/winlite/winlite-supervisor
          bash -n scripts/mi-pad4/winlite/winlite-session
          bash -n scripts/mi-pad4/winlite/winrun
          bash -n scripts/mi-pad4/winlite/wincontainer
          bash -n scripts/mi-pad4/mi-pad4-kwin-wayland-wrapper

      - name: Exercise Winlator-style container manager
        shell: bash
        run: |
          set -euo pipefail
          script="$PWD/scripts/mi-pad4/winlite/wincontainer"
          run_container() { bash "$script" "$@"; }

          export HOME="$(mktemp -d)"
          [[ "$(run_container current)" == default ]]
          run_container create game
          run_container use game
          [[ "$(run_container current)" == game ]]
          [[ "$(run_container prefix game)" == "$HOME/.winlite/containers/game/.wine" ]]
          test -L "$HOME/.wine-winlite"
          [[ "$(readlink "$HOME/.wine-winlite")" == "$HOME/.winlite/containers/game/.wine" ]]
          if run_container delete game; then
            echo 'active container deletion unexpectedly succeeded' >&2
            exit 1
          fi

          export HOME="$(mktemp -d)"
          mkdir -p "$HOME/.wine-winlite"
          touch "$HOME/.wine-winlite/migration-sentinel"
          [[ "$(run_container current)" == default ]]
          test -f "$HOME/.winlite/containers/default/.wine/migration-sentinel"
          test -L "$HOME/.wine-winlite"

      - name: Validate ultra-lite runtime invariants
        shell: bash
        run: |
          set -euo pipefail
          supervisor=scripts/mi-pad4/winlite/winlite-supervisor
          session=scripts/mi-pad4/winlite/winlite-session
          launcher=scripts/mi-pad4/winlite/winrun
          registry=scripts/mi-pad4/winlite/wine-default.reg
          wp=scripts/mi-pad4/winlite/90-winlite-wireplumber.conf
          full_workflow=.github/workflows/build-arch-mi-pad4-winlite.yml

          ! grep -Fq 'dbus-daemon --system' "$supervisor"
          grep -Fq 'dbus-run-session' "$supervisor"
          grep -Fq 'wincontainer current' "$session"
          grep -Fq 'winrun --shell' "$session"
          ! grep -Eq 'lxqt-panel|pcmanfm-qt' "$session" || grep -Fq 'pkill' "$session"
          grep -Fq 'mode=desktop' "$launcher"
          grep -Fq 'explorer.exe /desktop=shell' "$launcher"
          grep -Fq '"Graphics"="x11"' "$registry"
          ! grep -Fq '"Graphics"="wayland,x11"' "$registry"
          grep -Fq 'monitor.alsa = disabled' "$wp"
          grep -Fq 'monitor.bluez = disabled' "$wp"
          grep -Fq 'support.dbus = disabled' "$wp"
          grep -Fq 'support.logind = disabled' "$wp"
          grep -Fq 'winlite/build-kwin-bridge.sh' "$full_workflow"
          grep -Fq 'WINLITE-KWIN-PROFILE' "$full_workflow"

      - name: Validate RootFS build assertions
        shell: bash
        run: |
          set -euo pipefail
          dockerfile=Arch-WinLite.Dockerfile
          grep -Fq '/usr/local/bin/wincontainer' "$dockerfile"
          grep -Fq '/etc/wireplumber/wireplumber.conf.d/90-winlite.conf' "$dockerfile"
          grep -Fq 'ui=winlator-style-wine-explorer-desktop' "$dockerfile"
          grep -Fq 'container-model=per-prefix-active-container' "$dockerfile"
          grep -Fq 'dbus=session-only' "$dockerfile"
          grep -Fq -- "-name 'winewayland.drv.so'" "$dockerfile"
          ! grep -Eq '^[[:space:]]+(gawk|iputils|unzip|pam)[[:space:]]*\\$' "$dockerfile"

  build-bridge-kwin:
    needs: static-validation
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore bridge-only KWin validation cache
        id: kwin-cache
        uses: actions/cache@v4
        with:
          path: kwin-validation
          key: validate-kwin-bridge-v1-${{ hashFiles('scripts/mi-pad4/anland-kwin/**', 'scripts/mi-pad4/winlite/build-kwin-bridge.sh') }}

      - name: Build bridge-only KWin
        if: steps.kwin-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf kwin-validation
          mkdir -p kwin-validation
          docker run --privileged --rm \
            -v "$PWD:/repo" \
            -v "$PWD/kwin-validation:/out" \
            lfdevs/archlinuxarm:base-devel bash -lc '
              set -euo pipefail
              pacman -Syyu --noconfirm
              cp -a /repo/scripts/mi-pad4 /tmp/mi-pad4
              chmod +x /tmp/mi-pad4/winlite/build-kwin-bridge.sh
              ANLAND_PACKAGE_OUTPUT_DIR=/out \
                /tmp/mi-pad4/winlite/build-kwin-bridge.sh
            '

      - name: Validate bridge package
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(kwin-validation/kwin-[0-9]*.pkg.tar.*)
          ((${#packages[@]} == 1))
          test -s kwin-validation/WINLITE-KWIN-PROFILE
          bsdtar -xOf "${packages[0]}" .PKGINFO > kwin-validation.PKGINFO
          grep -Eq '^pkgname = kwin$' kwin-validation.PKGINFO
          for dep in \
            aurorae breeze iio-sensor-proxy kcmutils kdeclarative \
            kglobalacceld kirigami kitemmodels knewstuff knotifications \
            kquickcharts kscreenlocker kxmlgui libei libplasma \
            libqaccessibilityclient-qt6 milou plasma-activities kio
          do
            ! grep -Eq "^depend = ${dep}([<>=].*)?$" kwin-validation.PKGINFO
          done
          bsdtar -tf "${packages[0]}" | grep -Eq '(^|/)usr/bin/kwin_wayland$'
          cat kwin-validation/WINLITE-KWIN-PROFILE
