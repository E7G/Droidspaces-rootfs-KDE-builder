name: Build Arch Anland V2 KWin Test

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-arch-mi-pad4-kwin-test.yml'
      - 'scripts/mi-pad4/build-arch-anland-kwin.sh'
      - 'scripts/mi-pad4/anland-kwin/kwin.patch'
      - 'scripts/mi-pad4/anland-kwin/backend/**'
      - 'scripts/mi-pad4/droidspaces-wslg-*'
  workflow_dispatch:

concurrency:
  group: arch-anland-v2-kwin-test
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build patched KWin package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p kwin-mi-pad4-test
          docker run --privileged --rm \
            -v "$PWD:/repo" \
            -v "$PWD/kwin-mi-pad4-test:/out" \
            lfdevs/archlinuxarm:base-devel bash -lc '
              set -euo pipefail
              pacman -Syyu --noconfirm
              pacman -S --needed --noconfirm sudo
              useradd -m -s /bin/bash user
              cp -a /repo/scripts/mi-pad4 /tmp/mi-pad4
              chmod +x /tmp/mi-pad4/build-arch-anland-kwin.sh
              # Test artifacts target an existing rootfs that already carries
              # the patched KIO package. Building KIO again adds about 15 minutes
              # and cannot affect an Anland backend-only change.
              install -d /usr/share/droidspaces
              : > /usr/share/droidspaces/kio-runtime-named-socket
              BUILD_KDE=min \
              BUILD_KIO=false \
              BUILD_KWIN=true \
              BUILD_XWAYLAND=false \
              BUILD_PLASMA_WORKSPACE=false \
              ANLAND_PACKAGE_OUTPUT_DIR=/out \
                /tmp/mi-pad4/build-arch-anland-kwin.sh
            '
          for package in kwin-mi-pad4-test/*.pkg.tar.*; do
            safe_name="${package//:/_}"
            if [[ "$safe_name" != "$package" ]]; then
              mv -v "$package" "$safe_name"
            fi
          done
          cp -v scripts/mi-pad4/droidspaces-wslg-kwin kwin-mi-pad4-test/
          cp -v scripts/mi-pad4/droidspaces-wslg-prepare kwin-mi-pad4-test/
          cp -v scripts/mi-pad4/droidspaces-wslg-cleanup kwin-mi-pad4-test/
          chmod 755 kwin-mi-pad4-test/droidspaces-wslg-*
          cat > kwin-mi-pad4-test/README-ARCH-WSLG-V2.txt <<'EOF'
          Arch WSLg V2 test bundle
          ========================

          1. Install the patched KWin package:
             sudo pacman -U ./kwin-*.pkg.tar.*

          2. Install the Arch WSLg runtime hooks:
             sudo install -Dm755 droidspaces-wslg-kwin /usr/local/bin/droidspaces-wslg-kwin
             sudo install -Dm755 droidspaces-wslg-prepare /usr/local/sbin/droidspaces-wslg-prepare
             sudo install -Dm755 droidspaces-wslg-cleanup /usr/local/sbin/droidspaces-wslg-cleanup

          3. Use the current E7G Droidspaces + Anland builds.
             In Droidspaces container details -> Linux Apps, enable WSLg V2 shared compositor.

          The prepare/cleanup hooks temporarily stop the full Plasma desktop while
          WSLg V2 owns KWin, then restore it after the shared session exits.
          EOF
          sha256sum kwin-mi-pad4-test/*.pkg.tar.* > kwin-mi-pad4-test/SHA256SUMS

      - name: Upload test package
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: arch-anland-v2-kwin-test
          path: kwin-mi-pad4-test/
          retention-days: 7
