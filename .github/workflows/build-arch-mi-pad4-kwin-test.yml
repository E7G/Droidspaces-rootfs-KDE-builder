name: Build Arch Anland V2 KWin Test

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-arch-mi-pad4-kwin-test.yml'
      - 'scripts/mi-pad4/build-arch-anland-kwin.sh'
      - 'scripts/mi-pad4/anland-kwin/**'
  workflow_dispatch:

concurrency:
  group: arch-anland-v2-kwin-test
  cancel-in-progress: true

permissions:
  actions: write
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate Arch installer syntax
        shell: bash
        run: bash -n anland-build/install.sh

      - name: Build patched KWin/XWayland packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p kwin-mi-pad4-test
          docker run --privileged --rm \
            -v "$PWD:/repo" \
            -v "$PWD/kwin-mi-pad4-test:/out" \
            lfdevs/archlinuxarm:base-devel bash -lc '
              set -euo pipefail
              pacman -Syyu --noconfirm
              pacman -S --needed --noconfirm sudo
              useradd -m -s /bin/bash user
              cp -a /repo/scripts/mi-pad4 /tmp/mi-pad4
              chmod +x /tmp/mi-pad4/build-arch-anland-kwin.sh
              # Test artifacts target an existing rootfs that already carries
              # the patched KIO package. Building KIO again adds about 15 minutes
              # and cannot affect an Anland backend-only change.
              install -d /usr/share/droidspaces
              : > /usr/share/droidspaces/kio-runtime-named-socket
              ANLAND_ARCH_SOURCE=local \
              BUILD_KDE=min \
              BUILD_KIO=false \
              BUILD_KWIN=true \
              BUILD_XWAYLAND=true \
              BUILD_PLASMA_WORKSPACE=false \
              ANLAND_PACKAGE_OUTPUT_DIR=/out \
                /tmp/mi-pad4/build-arch-anland-kwin.sh
            '
          for package in kwin-mi-pad4-test/*.pkg.tar.*; do
            safe_name="${package//:/_}"
            if [[ "$safe_name" != "$package" ]]; then
              mv -v "$package" "$safe_name"
            fi
          done
          cp -v scripts/mi-pad4/droidspaces-wslg-kwin kwin-mi-pad4-test/
          cp -v scripts/mi-pad4/droidspaces-wslg-prepare kwin-mi-pad4-test/
          cp -v scripts/mi-pad4/droidspaces-wslg-cleanup kwin-mi-pad4-test/
          chmod 755 kwin-mi-pad4-test/droidspaces-wslg-*
          cat > kwin-mi-pad4-test/README-ARCH-WSLG-V2.txt <<'EOF'
          Arch WSLg V2 test bundle
          ========================

          Install the generated KWin/XWayland packages with pacman -U, then:
            sudo install -Dm755 droidspaces-wslg-kwin /usr/local/bin/droidspaces-wslg-kwin
            sudo install -Dm755 droidspaces-wslg-prepare /usr/local/sbin/droidspaces-wslg-prepare
            sudo install -Dm755 droidspaces-wslg-cleanup /usr/local/sbin/droidspaces-wslg-cleanup

          Use current E7G Droidspaces and Anland. In Linux Apps enable the
          WSLg V2 shared compositor switch.
          EOF
          sha256sum kwin-mi-pad4-test/*.pkg.tar.* > kwin-mi-pad4-test/SHA256SUMS

      - name: Upload test package
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: arch-anland-v2-packages
          path: kwin-mi-pad4-test/
          retention-days: 30


      - name: Publish Arch packages
        if: ${{ github.ref_name == 'main' }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          if ! git diff --quiet HEAD..origin/main -- \
            .github/workflows/build-arch-mi-pad4-kwin-test.yml \
            scripts/mi-pad4/build-arch-anland-kwin.sh \
            scripts/mi-pad4/anland-kwin; then
            echo "This run is stale for Arch backend sources; skip package publish"
            exit 0
          fi

          shopt -s nullglob
          packages=(kwin-mi-pad4-test/*.pkg.tar.*)
          if (("${#packages[@]}" == 0)); then
            echo "No Arch KWin/XWayland packages were produced" >&2
            exit 1
          fi

          # Preserve this run's binaries outside the working tree, then publish
          # them on top of the newest main. Binary package files cannot be
          # meaningfully rebased, and older concurrent runs may have published
          # files with the same names while this long native build was running.
          publish_src="$RUNNER_TEMP/arch-anland-v2-packages"
          rm -rf "$publish_src"
          mkdir -p "$publish_src"
          cp -v "${packages[@]}" "$publish_src/"

          git fetch --quiet origin main
          git reset --hard origin/main

          dest=anland-build/Arch
          mkdir -p "$dest"
          find "$dest" -maxdepth 1 -type f \
            \( -name '*.pkg.tar.*' -o -name 'SHA256SUMS' \) -delete
          cp -v "$publish_src"/*.pkg.tar.* "$dest/"
          (
            cd "$dest"
            sha256sum *.pkg.tar.* > SHA256SUMS
          )

          if [ -z "$(git status --porcelain -- "$dest")" ]; then
            echo "Arch packages are unchanged"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A "$dest"
          git commit -m "Update Arch Anland V2 KWin/XWayland packages"
          git push origin HEAD:main


      - name: Dispatch Arch V2 test RootFS
        if: ${{ github.ref_name == 'main' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run build-arch-anland-v2-test-rootfs.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main
