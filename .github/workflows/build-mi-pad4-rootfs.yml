name: Build Mi Pad 4 Plasma Mobile RootFS

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-mi-pad4-rootfs.yml
      - Ubuntu-26-KDE.Dockerfile
      - build_rootfs-qemu-aarch64.sh
      - build_rootfs-native.sh
      - scripts/ion-legacy-shim.c
      - scripts/mi-pad4/**
      - anland-build/ubuntu2604/**

permissions:
  contents: write

concurrency:
  group: mi-pad4-mobile-release
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build and publish Ubuntu 26 Plasma Mobile
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Mi Pad 4 RootFS
        shell: bash
        run: |
          set -euo pipefail
          chmod +x build_rootfs-qemu-aarch64.sh
          ./build_rootfs-qemu-aarch64.sh \
            -i Ubuntu-26-KDE.Dockerfile \
            -v "mi-pad4-mobile-${GITHUB_RUN_NUMBER}" \
            -K mobile \
            -L false \
            -P none \
            -g true \
            -a false \
            -b true \
            -c true \
            -d false \
            -e true \
            -f false \
            -h true \
            -j false \
            -n true \
            -S true \
            -t false \
            -u user \
            -A true \
            -M true

      - name: Validate and package release
        id: package
        shell: bash
        run: |
          set -euo pipefail
          source_archive="$(find . -maxdepth 1 -name 'Ubuntu-26-KDE-Mobile-Droidspaces-rootfs-aarch64-mi-pad4-mobile-*.tar.xz' -print -quit)"
          test -n "$source_archive"

          mkdir -p release_assets
          final_name="Ubuntu-26-Plasma-Mobile-Anland-MiPad4-aarch64-v${GITHUB_RUN_NUMBER}.tar.xz"
          mv "$source_archive" "release_assets/$final_name"

          tar -tf "release_assets/$final_name" | sed 's#^\./##' > rootfs-files.txt
          required=(
            sbin/droidspaces-init
            usr/local/bin/mi-pad4-start-wayland
            usr/bin/startplasmamobile
            usr/bin/kwin_wayland
            usr/lib/aarch64-linux-gnu/libexec/kactivitymanagerd
            usr/local/lib/libion-legacy-shim.so
            home/user/.config/plasma-localerc
            home/user/.config/fcitx5/profile
            home/user/.config/baloofilerc
            usr/share/locale/zh_CN/LC_MESSAGES/plasmashell.mo
          )
          for path in "${required[@]}"; do
            grep -Fxq "$path" rootfs-files.txt || {
              echo "Missing required RootFS path: $path" >&2
              exit 1
            }
          done

          if grep -Eq '^(usr/bin/snap|usr/lib/snapd)(/|$)' rootfs-files.txt; then
            echo "Snap components remain in RootFS" >&2
            exit 1
          fi

          tar -xOf "release_assets/$final_name" etc/passwd | grep -q '^user:'
          cp scripts/mi-pad4/container.config release_assets/mi-pad4-container.config
          cp scripts/mi-pad4/README.txt release_assets/README.txt
          cat >release_assets/mi-pad4-kernel-profile.txt <<'EOF'
          device=xiaomi-mi-pad-4-clover
          architecture=aarch64
          kernel=4.4
          kernel_features=KSU,ReKSU,VGEM,DRM,KGSL
          desktop=Plasma-Mobile
          display=Anland-Wayland
          gpu=KGSL-accelerated-KWin
          ion_abi=legacy-shim
          audio=Anland
          input=Fcitx5-Pinyin,Maliit
          locale=zh_CN.UTF-8
          default_user=user
          snap=disabled
          systemd_compat=257
          EOF
          (cd release_assets && sha256sum "$final_name" > SHA256SUMS)
          echo "archive=$final_name" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: mi-pad4-plasma-mobile-rootfs
          path: release_assets/
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mi-pad4-mobile-v${{ github.run_number }}
          name: 小米平板 4 Plasma Mobile RootFS v${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            小米平板 4（clover）专用 Droidspaces RootFS。

            - Ubuntu 26.04 aarch64，默认用户 `user`，密码 `1234`
            - Plasma Mobile + Anland Wayland
            - KWin 使用 KGSL GPU 加速和 legacy ION shim
            - 简体中文、Noto CJK、Fcitx5 拼音、Maliit 触屏键盘
            - Anland 音频，PipeWire/PulseAudio 兼容组件
            - 已移除并阻止 Ubuntu Snap
            - 内置 Linux 4.4 可用的 Droidspaces custom init
            - 针对 KSU/ReKSU、VGEM、DRM、KGSL 内核配置

            使用前将 `mi-pad4-container.config` 中的专用字段合并到现有 Ubuntu 容器配置，然后启动容器并打开 Anland。
          files: release_assets/*
