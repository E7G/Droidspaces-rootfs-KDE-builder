name: Build Arch Mi Pad 4 RootFS

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Desktop profile
        required: true
        type: choice
        default: min
        options:
          - min

      publish_release:
        description: Publish this build to GitHub Releases
        required: true
        type: boolean
        default: false

      enable_clover_firefox:
        description: Integrate experimental Clover Firefox into rootfs
        required: true
        type: boolean
        # Keep the experimental browser package out of the normal slim image.
        # The dedicated Firefox job still builds it for later testing.
        default: false

permissions:
  contents: write

concurrency:
  group: arch-mi-pad4-${{ inputs.profile }}
  cancel-in-progress: false

jobs:
  firefox:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 720

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Clover V4L2 VA-API bridge
        shell: bash
        env:
          V4L2_VAAPI_COMMIT: 1be35ad2fc1bc66c76842d735b6ec91e11944a44
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libdrm-dev \
            libva-dev \
            meson \
            ninja-build

          git clone --no-checkout \
            https://github.com/E7G/libva-v4l2-stateful.git \
            .ci/libva-v4l2-stateful
          git -C .ci/libva-v4l2-stateful checkout "$V4L2_VAAPI_COMMIT"
          git -C .ci/libva-v4l2-stateful apply \
            "$GITHUB_WORKSPACE/scripts/mi-pad4/libva-v4l2-stateful/0001-clover-firefox-prime2-copy.patch"
          meson setup \
            .ci/libva-v4l2-stateful/build \
            .ci/libva-v4l2-stateful
          meson compile -C .ci/libva-v4l2-stateful/build

      - name: Restore Clover Firefox package
        id: firefox-cache
        uses: actions/cache@v4
        with:
          path: firefox-mi-pad4
          key: firefox-clover-153.0.3-1.3-${{ hashFiles('scripts/mi-pad4/firefox/**') }}

      - name: Build Firefox 153 for Clover
        if: steps.firefox-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail

          rm -rf .ci/firefox firefox-mi-pad4

          git clone \
            --depth 1 \
            --branch 153.0.3-1 \
            https://gitlab.archlinux.org/archlinux/packaging/packages/firefox.git \
            .ci/firefox

          cp \
            scripts/mi-pad4/firefox/0002-mi-pad4-clover-direct-dmabuf.patch \
            scripts/mi-pad4/firefox/0003-mi-pad4-clover-full-egl-damage.patch \
            scripts/mi-pad4/firefox/customize-pkgbuild.py \
            .ci/firefox/

          (
            cd .ci/firefox
            python3 customize-pkgbuild.py
          )

          # Rust LTO/PGO peaks above runner RAM while linking libxul on arm64.
          # Keep PGO instead of shipping a slower build; provide swap and cap
          # compile fan-out so the kernel does not SIGKILL rustc.
          swapfile=/mnt/firefox-build.swap
          sudo fallocate -l 16G "$swapfile"
          sudo chmod 0600 "$swapfile"
          sudo mkswap "$swapfile"
          sudo swapon "$swapfile"
          free -h

          docker run \
            --privileged \
            --rm \
            -v "$PWD/.ci/firefox:/src" \
            lfdevs/archlinuxarm:base-devel \
            bash -lc '
              set -euo pipefail

              pacman -Syyu --noconfirm
              pacman -S --needed --noconfirm sudo base-devel git

              useradd -m -s /bin/bash builder
              echo "builder ALL=(ALL) NOPASSWD: ALL" >/etc/sudoers.d/builder
              chmod 0440 /etc/sudoers.d/builder
              chown -R builder:builder /src

              sudo -u builder bash -lc "
                set -euo pipefail
                cd /src
                makepkg -s --noconfirm --needed --skippgpcheck
              "
            '

          mkdir -p firefox-mi-pad4
          cp -v \
            .ci/firefox/firefox-153.0.3-1.3-aarch64.pkg.tar.* \
            firefox-mi-pad4/

          sha256sum \
            firefox-mi-pad4/firefox-153.0.3-1.3-aarch64.pkg.tar.* \
            | tee firefox-mi-pad4/FIREFOX-SHA256SUMS

      - name: Upload Clover Firefox package
        uses: actions/upload-artifact@v4
        with:
          name: firefox-mi-pad4
          path: firefox-mi-pad4/
          if-no-files-found: error
          retention-days: 30

  build-mesa:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Mesa package from cache
        id: mesa-cache
        uses: actions/cache@v4
        with:
          path: mesa-mi-pad4
          key: mesa-${{ hashFiles('scripts/mi-pad4/mesa/**') }}

      - name: Build patched Mesa for KGSL
        if: steps.mesa-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail

          rm -rf .ci/archlinuxarm-PKGBUILDs mesa-mi-pad4

          git clone \
            --depth 1 \
            --branch freedreno \
            https://github.com/E7G/archlinuxarm-PKGBUILDs.git \
            .ci/archlinuxarm-PKGBUILDs

          docker run \
            --privileged \
            --rm \
            -v "$PWD/.ci/archlinuxarm-PKGBUILDs:/src" \
            lfdevs/archlinuxarm:base-devel \
            bash -lc '
              set -euo pipefail

              pacman -Syyu --noconfirm
              pacman -S --needed --noconfirm \
                sudo \
                base-devel \
                git \
                ccache

              useradd -m -s /bin/bash builder

              echo "builder ALL=(ALL) NOPASSWD: ALL" \
                >/etc/sudoers.d/builder

              chmod 0440 /etc/sudoers.d/builder

              chown -R builder:builder /src

              sudo -u builder bash -lc "
                set -euo pipefail

                export CCACHE_DIR=/home/builder/.ccache
                ccache --max-size=2G

                cd /src/extra/mesa
                makepkg -s --noconfirm --needed
              "
            '

          mkdir -p mesa-mi-pad4

          shopt -s nullglob

          for pattern in \
            'mesa-[0-9]*.pkg.tar.*' \
            'vulkan-freedreno-*.pkg.tar.*' \
            'vulkan-mesa-implicit-layers-*.pkg.tar.*'
          do
            files=(.ci/archlinuxarm-PKGBUILDs/extra/mesa/$pattern)

            if ((${#files[@]} == 0)); then
              echo "Missing Mesa package matching: $pattern" >&2
              exit 1
            fi

            cp -v "${files[@]}" mesa-mi-pad4/
          done

          test -n "$(
            find mesa-mi-pad4 \
              -maxdepth 1 \
              -name 'mesa-*.pkg.tar.*' \
              -print \
              -quit
          )"

          # Rename files to remove colons (epoch version format) for GitHub Actions compatibility
          cd mesa-mi-pad4
          for file in *; do
            mv "$file" "${file//:/_}"
          done
          cd ..

          sha256sum \
            mesa-mi-pad4/*.pkg.tar.* \
            | tee mesa-mi-pad4/SHA256SUMS

      - name: Upload Mesa packages
        uses: actions/upload-artifact@v4
        with:
          name: mesa-mi-pad4
          path: mesa-mi-pad4/
          if-no-files-found: error
          retention-days: 30

  build-pango:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Pango package from cache
        id: pango-cache
        uses: actions/cache@v4
        with:
          path: pango-mi-pad4
          key: pango-${{ hashFiles('scripts/mi-pad4/pango/**') }}

      - name: Build Pango
        if: steps.pango-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          PANGO_PKG_COMMIT: 92547f34a91108b16e6dd2ea08317e0bd1be7487
        run: |
          set -euo pipefail

          rm -rf .ci/pango pango-mi-pad4

          git clone \
            --filter=blob:none \
            --no-checkout \
            https://gitlab.archlinux.org/archlinux/packaging/packages/pango.git \
            .ci/pango

          git -C .ci/pango fetch \
            --depth 1 \
            origin \
            "$PANGO_PKG_COMMIT"

          git -C .ci/pango checkout \
            --detach \
            FETCH_HEAD

          docker run \
            --privileged \
            --rm \
            -v "$PWD/.ci/pango:/src" \
            lfdevs/archlinuxarm:base-devel \
            bash -lc '
              set -euo pipefail

              pacman -Syyu --noconfirm
              pacman -S --needed --noconfirm \
                sudo \
                base-devel \
                git \
                ccache

              useradd -m -s /bin/bash builder

              echo "builder ALL=(ALL) NOPASSWD: ALL" \
                >/etc/sudoers.d/builder

              chmod 0440 /etc/sudoers.d/builder

              chown -R builder:builder /src

              sudo -u builder bash -lc "
                set -euo pipefail

                export CCACHE_DIR=/home/builder/.ccache
                ccache --max-size=2G

                cd /src
                makepkg -sA --noconfirm --needed
              "
            '

          mkdir -p pango-mi-pad4

          cp -v \
            .ci/pango/pango-[0-9]*.pkg.tar.* \
            pango-mi-pad4/

          test -n "$(
            find pango-mi-pad4 \
              -maxdepth 1 \
              -name 'pango-*.pkg.tar.*' \
              -print \
              -quit
          )"

          # Rename files to remove colons (epoch version format) for GitHub Actions compatibility
          cd pango-mi-pad4
          for file in *; do
            mv "$file" "${file//:/_}"
          done
          cd ..

          sha256sum \
            pango-mi-pad4/*.pkg.tar.* \
            | tee pango-mi-pad4/SHA256SUMS

      - name: Upload Pango package
        uses: actions/upload-artifact@v4
        with:
          name: pango-mi-pad4
          path: pango-mi-pad4/
          if-no-files-found: error
          retention-days: 30

  build-kio:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore KIO package from cache
        id: kio-cache
        uses: actions/cache@v4
        with:
          path: kio-mi-pad4
          key: kio-6.29.0-1-97c0d35-${{ hashFiles('scripts/mi-pad4/kio-runtime-named-socket.patch', 'scripts/mi-pad4/apply-kio-patch.sh') }}

      - name: Build KIO
        if: steps.kio-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          KIO_PKG_COMMIT: 97c0d35b1b7e526eef330747e9bf28e6da31f430
        run: |
          set -euo pipefail

          rm -rf .ci/kio kio-mi-pad4

          git clone \
            --filter=blob:none \
            --no-checkout \
            https://gitlab.archlinux.org/archlinux/packaging/packages/kio.git \
            .ci/kio

          git -C .ci/kio fetch \
            --depth 1 \
            origin \
            "$KIO_PKG_COMMIT"

          git -C .ci/kio checkout \
            --detach \
            FETCH_HEAD

          # Apply KIO runtime named socket patch
          cp scripts/mi-pad4/kio-runtime-named-socket.patch .ci/kio/
          chmod +x scripts/mi-pad4/apply-kio-patch.sh
          bash scripts/mi-pad4/apply-kio-patch.sh

          docker run \
            --privileged \
            --rm \
            -v "$PWD/.ci/kio:/src" \
            lfdevs/archlinuxarm:base-devel \
            bash -lc '
              set -euo pipefail

              pacman -Syyu --noconfirm
              pacman -S --needed --noconfirm \
                sudo \
                base-devel \
                git \
                ccache \
                gnupg

              useradd -m -s /bin/bash builder

              echo "builder ALL=(ALL) NOPASSWD: ALL" \
                >/etc/sudoers.d/builder

              chmod 0440 /etc/sudoers.d/builder

              chown -R builder:builder /src

              sudo -u builder bash -lc "
                set -euo pipefail

                export CCACHE_DIR=/home/builder/.ccache
                ccache --max-size=2G

                cd /src
                gpg --recv-keys 2C8DF587A6D4AAC1
                makepkg -s --noconfirm --needed
              "
            '

          mkdir -p kio-mi-pad4

          cp -v \
            "$PWD/.ci/kio/kio-"[0-9]*.pkg.tar.* \
            kio-mi-pad4/

          test -n "$(
            find kio-mi-pad4 \
              -maxdepth 1 \
              -name 'kio-*.pkg.tar.*' \
              -print \
              -quit
          )"



          sha256sum \
            kio-mi-pad4/*.pkg.tar.* \
            | tee kio-mi-pad4/SHA256SUMS

      - name: Upload KIO package
        uses: actions/upload-artifact@v4
        with:
          name: kio-mi-pad4
          path: kio-mi-pad4/
          if-no-files-found: error
          retention-days: 30

  build-rootfs:
    needs: [firefox, build-mesa, build-pango, build-kio]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Clover Firefox package
        uses: actions/download-artifact@v4
        with:
          name: firefox-mi-pad4
          path: local-packages-mi-pad4

      - name: Download Mesa packages
        uses: actions/download-artifact@v4
        with:
          name: mesa-mi-pad4
          path: local-packages-mi-pad4

      - name: Download Pango package
        uses: actions/download-artifact@v4
        with:
          name: pango-mi-pad4
          path: local-packages-mi-pad4

      - name: Download KIO package
        uses: actions/download-artifact@v4
        with:
          name: kio-mi-pad4
          path: local-packages-mi-pad4

      - name: Validate local package bundle
        shell: bash
        env:
          ENABLE_CLOVER_FIREFOX: ${{ inputs.enable_clover_firefox }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          required=(
            'local-packages-mi-pad4/pango-*.pkg.tar.*'
            'local-packages-mi-pad4/kio-6.29.0-1-aarch64.pkg.tar.*'
            'local-packages-mi-pad4/mesa-[0-9]*.pkg.tar.*'
            'local-packages-mi-pad4/vulkan-freedreno-*.pkg.tar.*'
            'local-packages-mi-pad4/vulkan-mesa-implicit-layers-*.pkg.tar.*'
          )
          if [[ "$ENABLE_CLOVER_FIREFOX" = true ]]; then
            required+=('local-packages-mi-pad4/firefox-153.0.3-1.3-aarch64.pkg.tar.*')
          fi

          for pattern in "${required[@]}"; do
            files=($pattern)
            if ((${#files[@]} == 0)); then
              echo "Missing downloaded package: $pattern" >&2
              exit 1
            fi
            printf 'verified: %s\n' "${files[@]}"
          done

      - name: Setup Docker buildx with cache
        run: |
          docker run --privileged --rm tonistiigi/binfmt --install all > /dev/null 2>&1

          if ! docker buildx inspect droidspaces-builder >/dev/null 2>&1; then
            docker buildx create --name droidspaces-builder --driver docker-container --use
          else
            docker buildx use droidspaces-builder
          fi

          docker buildx inspect --bootstrap

      - name: Build Arch rootfs with cache
        shell: bash
        env:
          PROFILE: ${{ inputs.profile }}
          ENABLE_CLOVER_FIREFOX: ${{ inputs.enable_clover_firefox }}
        run: |
          set -euo pipefail

          chmod +x build_rootfs-qemu-aarch64.sh

          ./build_rootfs-qemu-aarch64.sh \
            -i Arch-KDE.Dockerfile \
            -v "mi-pad4-${PROFILE}-${GITHUB_RUN_NUMBER}" \
            -K "${PROFILE}" \
            -L false \
            -P none \
            -g true \
            -a false \
            -b true \
            -c true \
            -d false \
            -e true \
            -f false \
            -h false \
            -j false \
            -n true \
            -S true \
            -t false \
            -u user \
            -A true \
            -M true \
            -F "${ENABLE_CLOVER_FIREFOX}"

      - name: Validate rootfs
        shell: bash
        env:
          ENABLE_CLOVER_FIREFOX: ${{ inputs.enable_clover_firefox }}
        run: |
          set -euo pipefail

          #
          # Locate generated rootfs
          #
          mapfile -t archives < <(
            find . \
              -maxdepth 1 \
              -type f \
              -name 'Arch-KDE-Wayland-Droidspaces-rootfs-aarch64-*.tar.xz' \
              -print
          )

          if ((${#archives[@]} == 0)); then
            echo "RootFS archive was not generated" >&2
            exit 1
          fi

          if ((${#archives[@]} > 1)); then
            echo "Multiple RootFS archives found:" >&2
            printf '  %s\n' "${archives[@]}" >&2
            exit 1
          fi

          archive="${archives[0]}"

          mkdir -p release_assets

          final="Arch-${{ inputs.profile }}-Anland-MiPad4-aarch64-v${GITHUB_RUN_NUMBER}.tar.xz"

          mv \
            "$archive" \
            "release_assets/$final"

          rootfs_archive="release_assets/$final"

          #
          # Store raw tar member list.
          #
          tar -tf "$rootfs_archive" \
            > rootfs-files-raw.txt

          #
          # Store normalized member list:
          #
          #   ./etc/foo -> etc/foo
          #   etc/foo   -> etc/foo
          #
          sed 's#^\./##' \
            rootfs-files-raw.txt \
            > rootfs-files.txt

          #
          # Helper: return the real member name used inside the tar archive.
          #
          # This supports both:
          #
          #   etc/droidspaces-systemd257
          #
          # and:
          #
          #   ./etc/droidspaces-systemd257
          #
          tar_member_name() {
            local wanted="${1#./}"
            local member=""

            member="$(
              awk -v wanted="$wanted" '
                {
                  normalized=$0
                  sub(/^\.\//, "", normalized)

                  if (normalized == wanted) {
                    print $0
                    exit
                  }
                }
              ' rootfs-files-raw.txt
            )"

            if [[ -z "$member" ]]; then
              echo "Missing archive member: $wanted" >&2
              return 1
            fi

            printf '%s\n' "$member"
          }

          #
          # Helper: print a file directly from the tar archive.
          #
          tar_cat() {
            local wanted="$1"
            local member

            member="$(tar_member_name "$wanted")"

            tar -xOf \
              "$rootfs_archive" \
              "$member"
          }

          #
          # Validate droidspaces-init
          #
          grep -Eq \
            '^(sbin|usr/bin)/droidspaces-init$' \
            rootfs-files.txt \
            || {
              echo "Missing droidspaces-init" >&2
              exit 1
            }

          #
          # Validate required runtime files
          #
          for path in \
            usr/local/bin/mi-pad4-start-wayland \
            etc/droidspaces-systemd257 \
            etc/systemd/system/mi-pad4-desktop.service \
            etc/systemd/system/multi-user.target.wants/mi-pad4-desktop.service \
            usr/local/bin/dolphin \
            usr/local/lib/libion-legacy-shim.so \
            usr/local/libexec/mi-pad4-cachyos-tuning \
            usr/lib/sysctl.d/70-mi-pad4-cachyos.conf \
            usr/lib/udev/rules.d/60-mi-pad4-ioschedulers.rules \
            etc/systemd/system/mi-pad4-cachyos-tuning.service \
            etc/profile.d/90-mi-pad4-cachyos-environment.sh \
            usr/lib/firefox/defaults/pref/mi-pad4-anland.js \
            usr/share/droidspaces/cachyos-mi-pad4 \
            usr/bin/startplasma-wayland \
            usr/bin/kwin_wayland
          do
            grep -Fxq \
              "$path" \
              rootfs-files.txt \
              || {
                echo "Missing $path" >&2
                exit 1
              }
          done

          #
          # Droidspaces patches / markers
          #
          grep -Fxq \
            'usr/share/droidspaces/anland-kwin-package' \
            rootfs-files.txt

          grep -Fxq \
            'usr/share/droidspaces/kio-runtime-named-socket' \
            rootfs-files.txt

          grep -Fxq \
            'usr/share/droidspaces/mesa-kgsl-dmabuf-import' \
            rootfs-files.txt

          #
          # Validate locally built package versions
          #
          grep -Eq \
            '^var/lib/pacman/local/mesa-1:26\.2\.0-9/' \
            rootfs-files.txt \
            || {
              echo "Expected Mesa 1:26.2.0-9 is not installed" >&2
              exit 1
            }

          grep -Eq \
            '^var/lib/pacman/local/pango-1:[0-9]+\.[0-9]+\.[0-9]+-/' \
            rootfs-files.txt \
            || {
              echo "Pango is not installed" >&2
              exit 1
            }

          grep -Eq \
            '^var/lib/pacman/local/kio-6\.29\.0-1/' \
            rootfs-files.txt \
            || {
              echo "Expected patched KIO 6.29.0-1 is not installed" >&2
              exit 1
            }

          #
          # Validate Firefox integration if enabled
          #
          if [[ "${ENABLE_CLOVER_FIREFOX}" = "true" ]]; then
            grep -Eq \
              '^var/lib/pacman/local/firefox-153\.0\.3-1\.3-/' \
              rootfs-files.txt \
              || {
                echo "Firefox 153.0.3-1.3 is not installed" >&2
                exit 1
              }

            grep -Eq \
              '^usr/lib/firefox/' \
              rootfs-files.txt \
              || {
                echo "Firefox library directory is missing" >&2
                exit 1
              }
          fi

          echo "RootFS validation passed"

      - name: Upload rootfs
        uses: actions/upload-artifact@v4
        with:
          name: rootfs-arch-mi-pad4-${{ inputs.profile }}
          path: release_assets/
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [build-rootfs]
    if: inputs.publish_release == true
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download rootfs
        uses: actions/download-artifact@v4
        with:
          name: rootfs-arch-mi-pad4-${{ inputs.profile }}
          path: release_assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mi-pad4-${{ inputs.profile }}-${{ github.run_number }}
          name: Mi Pad 4 Arch RootFS - ${{ inputs.profile }} Profile - Build ${{ github.run_number }}
          files: release_assets/*
          draft: false
          prerelease: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
