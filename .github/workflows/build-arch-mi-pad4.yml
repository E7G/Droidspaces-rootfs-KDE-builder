name: Build Arch Mi Pad 4 RootFS

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Desktop profile
        required: true
        type: choice
        default: min
        options:
          - min

      publish_release:
        description: Publish this build to GitHub Releases
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: arch-mi-pad4-${{ inputs.profile }}
  cancel-in-progress: false

jobs:
  firefox:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 720

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Clover V4L2 VA-API bridge
        shell: bash
        env:
          V4L2_VAAPI_COMMIT: 1be35ad2fc1bc66c76842d735b6ec91e11944a44
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libdrm-dev \
            libva-dev \
            meson \
            ninja-build

          git clone --no-checkout \
            https://github.com/E7G/libva-v4l2-stateful.git \
            .ci/libva-v4l2-stateful
          git -C .ci/libva-v4l2-stateful checkout "$V4L2_VAAPI_COMMIT"
          git -C .ci/libva-v4l2-stateful apply \
            "$GITHUB_WORKSPACE/scripts/mi-pad4/libva-v4l2-stateful/0001-clover-firefox-prime2-copy.patch"
          meson setup \
            .ci/libva-v4l2-stateful/build \
            .ci/libva-v4l2-stateful
          meson compile -C .ci/libva-v4l2-stateful/build

      - name: Restore Clover Firefox package
        id: firefox-cache
        uses: actions/cache@v4
        with:
          path: firefox-mi-pad4
          key: firefox-clover-153.0.3-1.2-${{ hashFiles('scripts/mi-pad4/firefox/**') }}

      - name: Build Firefox 153 for Clover
        if: steps.firefox-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail

          rm -rf .ci/firefox firefox-mi-pad4

          git clone \
            --depth 1 \
            --branch 153.0.3-1 \
            https://gitlab.archlinux.org/archlinux/packaging/packages/firefox.git \
            .ci/firefox

          cp \
            scripts/mi-pad4/firefox/0002-mi-pad4-clover-direct-dmabuf.patch \
            scripts/mi-pad4/firefox/customize-pkgbuild.py \
            .ci/firefox/

          (
            cd .ci/firefox
            python3 customize-pkgbuild.py
          )

          # Rust LTO/PGO peaks above runner RAM while linking libxul on arm64.
          # Keep PGO instead of shipping a slower build; provide swap and cap
          # compile fan-out so the kernel does not SIGKILL rustc.
          swapfile=/mnt/firefox-build.swap
          sudo fallocate -l 16G "$swapfile"
          sudo chmod 0600 "$swapfile"
          sudo mkswap "$swapfile"
          sudo swapon "$swapfile"
          free -h

          docker run \
            --privileged \
            --rm \
            -v "$PWD/.ci/firefox:/src" \
            lfdevs/archlinuxarm:base-devel \
            bash -lc '
              set -euo pipefail

              pacman -Syyu --noconfirm
              pacman -S --needed --noconfirm sudo base-devel git

              useradd -m -s /bin/bash builder
              echo "builder ALL=(ALL) NOPASSWD: ALL" >/etc/sudoers.d/builder
              chmod 0440 /etc/sudoers.d/builder
              chown -R builder:builder /src

              sudo -u builder bash -lc "
                set -euo pipefail
                cd /src
                makepkg -s --noconfirm --needed --skippgpcheck
              "
            '

          mkdir -p firefox-mi-pad4
          cp -v \
            .ci/firefox/firefox-153.0.3-1.2-aarch64.pkg.tar.* \
            firefox-mi-pad4/

          sha256sum \
            firefox-mi-pad4/firefox-153.0.3-1.2-aarch64.pkg.tar.* \
            | tee firefox-mi-pad4/FIREFOX-SHA256SUMS

      - name: Upload Clover Firefox package
        uses: actions/upload-artifact@v4
        with:
          name: firefox-mi-pad4
          path: firefox-mi-pad4/
          if-no-files-found: error
          retention-days: 30

  build:
    needs: firefox
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build patched Mesa for KGSL
        shell: bash
        env:
          PANGO_PKG_COMMIT: 92547f34a91108b16e6dd2ea08317e0bd1be7487
        run: |
          set -euo pipefail

          rm -rf \
            .ci/archlinuxarm-PKGBUILDs \
            .ci/pango \
            mesa-mi-pad4 \
            local-packages-mi-pad4

          git clone \
            --depth 1 \
            --branch freedreno \
            https://github.com/E7G/archlinuxarm-PKGBUILDs.git \
            .ci/archlinuxarm-PKGBUILDs

          git clone \
            --filter=blob:none \
            --no-checkout \
            https://gitlab.archlinux.org/archlinux/packaging/packages/pango.git \
            .ci/pango

          git -C .ci/pango fetch \
            --depth 1 \
            origin \
            "$PANGO_PKG_COMMIT"

          git -C .ci/pango checkout \
            --detach \
            FETCH_HEAD

          docker run \
            --privileged \
            --rm \
            -v "$PWD/.ci/archlinuxarm-PKGBUILDs:/src" \
            -v "$PWD/.ci/pango:/pango" \
            lfdevs/archlinuxarm:base-devel \
            bash -lc '
              set -euo pipefail

              pacman -Syyu --noconfirm
              pacman -S --needed --noconfirm \
                sudo \
                base-devel \
                git \
                ccache

              useradd -m -s /bin/bash builder

              echo "builder ALL=(ALL) NOPASSWD: ALL" \
                >/etc/sudoers.d/builder

              chmod 0440 /etc/sudoers.d/builder

              chown -R builder:builder \
                /src \
                /pango

              sudo -u builder bash -lc "
                set -euo pipefail

                export CCACHE_DIR=/home/builder/.ccache
                ccache --max-size=2G

                cd /src/extra/mesa
                makepkg -s --noconfirm --needed

                cd /pango
                makepkg -sA --noconfirm --needed
              "
            '

          mkdir -p mesa-mi-pad4

          shopt -s nullglob

          for pattern in \
            'mesa-[0-9]*.pkg.tar.*' \
            'vulkan-freedreno-*.pkg.tar.*' \
            'vulkan-mesa-implicit-layers-*.pkg.tar.*'
          do
            files=(.ci/archlinuxarm-PKGBUILDs/extra/mesa/$pattern)

            if ((${#files[@]} == 0)); then
              echo "Missing Mesa package matching: $pattern" >&2
              exit 1
            fi

            cp -v "${files[@]}" mesa-mi-pad4/
          done

          test -n "$(
            find mesa-mi-pad4 \
              -maxdepth 1 \
              -name 'mesa-*.pkg.tar.*' \
              -print \
              -quit
          )"

          sha256sum \
            mesa-mi-pad4/*.pkg.tar.* \
            | tee mesa-mi-pad4/SHA256SUMS

          mkdir -p local-packages-mi-pad4

          pango_packages=(
            .ci/pango/pango-[0-9]*.pkg.tar.*
          )

          if ((${#pango_packages[@]} == 0)); then
            echo "Missing built Pango package" >&2
            exit 1
          fi

          cp -v \
            "${pango_packages[@]}" \
            local-packages-mi-pad4/

          test -n "$(
            find local-packages-mi-pad4 \
              -maxdepth 1 \
              -name 'pango-*.pkg.tar.*' \
              -print \
              -quit
          )"

          sha256sum \
            local-packages-mi-pad4/*.pkg.tar.* \
            | tee local-packages-mi-pad4/SHA256SUMS

      - name: Download Clover Firefox package
        uses: actions/download-artifact@v4
        with:
          name: firefox-mi-pad4
          path: local-packages-mi-pad4

      - name: Build Arch rootfs
        shell: bash
        env:
          PROFILE: ${{ inputs.profile }}
        run: |
          set -euo pipefail

          chmod +x build_rootfs-qemu-aarch64.sh

          ./build_rootfs-qemu-aarch64.sh \
            -i Arch-KDE.Dockerfile \
            -v "mi-pad4-${PROFILE}-${GITHUB_RUN_NUMBER}" \
            -K "${PROFILE}" \
            -L false \
            -P none \
            -g true \
            -a false \
            -b true \
            -c true \
            -d false \
            -e true \
            -f false \
            -h false \
            -j false \
            -n true \
            -S true \
            -t false \
            -u user \
            -A true \
            -M true

      - name: Validate rootfs
        shell: bash
        run: |
          set -euo pipefail

          #
          # Locate generated rootfs
          #
          mapfile -t archives < <(
            find . \
              -maxdepth 1 \
              -type f \
              -name 'Arch-KDE-Wayland-Droidspaces-rootfs-aarch64-*.tar.xz' \
              -print
          )

          if ((${#archives[@]} == 0)); then
            echo "RootFS archive was not generated" >&2
            exit 1
          fi

          if ((${#archives[@]} > 1)); then
            echo "Multiple RootFS archives found:" >&2
            printf '  %s\n' "${archives[@]}" >&2
            exit 1
          fi

          archive="${archives[0]}"

          mkdir -p release_assets

          final="Arch-${{ inputs.profile }}-Anland-MiPad4-aarch64-v${GITHUB_RUN_NUMBER}.tar.xz"

          mv \
            "$archive" \
            "release_assets/$final"

          rootfs_archive="release_assets/$final"

          #
          # Store raw tar member list.
          #
          tar -tf "$rootfs_archive" \
            > rootfs-files-raw.txt

          #
          # Store normalized member list:
          #
          #   ./etc/foo -> etc/foo
          #   etc/foo   -> etc/foo
          #
          sed 's#^\./##' \
            rootfs-files-raw.txt \
            > rootfs-files.txt

          #
          # Helper: return the real member name used inside the tar archive.
          #
          # This supports both:
          #
          #   etc/droidspaces-systemd257
          #
          # and:
          #
          #   ./etc/droidspaces-systemd257
          #
          tar_member_name() {
            local wanted="${1#./}"
            local member=""

            member="$(
              awk -v wanted="$wanted" '
                {
                  normalized=$0
                  sub(/^\.\//, "", normalized)

                  if (normalized == wanted) {
                    print $0
                    exit
                  }
                }
              ' rootfs-files-raw.txt
            )"

            if [[ -z "$member" ]]; then
              echo "Missing archive member: $wanted" >&2
              return 1
            fi

            printf '%s\n' "$member"
          }

          #
          # Helper: print a file directly from the tar archive.
          #
          tar_cat() {
            local wanted="$1"
            local member

            member="$(tar_member_name "$wanted")"

            tar -xOf \
              "$rootfs_archive" \
              "$member"
          }

          #
          # Validate droidspaces-init
          #
          grep -Eq \
            '^(sbin|usr/bin)/droidspaces-init$' \
            rootfs-files.txt \
            || {
              echo "Missing droidspaces-init" >&2
              exit 1
            }

          #
          # Validate required runtime files
          #
          for path in \
            usr/local/bin/mi-pad4-start-wayland \
            etc/droidspaces-systemd257 \
            etc/systemd/system/mi-pad4-desktop.service \
            etc/systemd/system/multi-user.target.wants/mi-pad4-desktop.service \
            usr/local/bin/dolphin \
            usr/local/bin/mi-pad4-firefox \
            usr/share/droidspaces/firefox-clover-direct \
            usr/local/lib/libion-legacy-shim.so \
            usr/local/lib/firefox-vaapi/libva-drm.so.2 \
            usr/lib/dri/v4l2_drv_video.so \
            usr/lib/firefox/glxtest \
            usr/lib/firefox/glxtest.real \
            usr/bin/startplasma-wayland \
            usr/bin/kwin_wayland
          do
            grep -Fxq \
              "$path" \
              rootfs-files.txt \
              || {
                echo "Missing $path" >&2
                exit 1
              }
          done

          #
          # Droidspaces patches / markers
          #
          grep -Fxq \
            'usr/share/droidspaces/anland-kwin-package' \
            rootfs-files.txt

          grep -Fxq \
            'usr/share/droidspaces/kio-runtime-named-socket' \
            rootfs-files.txt

          grep -Fxq \
            'usr/share/droidspaces/mesa-kgsl-dmabuf-import' \
            rootfs-files.txt

          #
          # Validate locally built package versions
          #
          grep -Eq \
            '^var/lib/pacman/local/mesa-1:26\.2\.0-9/' \
            rootfs-files.txt \
            || {
              echo "Expected Mesa 1:26.2.0-9 is not installed" >&2
              exit 1
            }

          grep -Eq \
            '^var/lib/pacman/local/pango-1:1\.58\.2-1/' \
            rootfs-files.txt \
            || {
              echo "Expected Pango 1:1.58.2-1 is not installed" >&2
              exit 1
            }

          grep -Eq \
            '^var/lib/pacman/local/firefox-153\.0\.3-1\.2/' \
            rootfs-files.txt \
            || {
              echo "Expected Clover Firefox 153.0.3-1.2 is not installed" >&2
              exit 1
            }

          tar_cat \
            usr/share/droidspaces/firefox-clover-direct \
            | grep -Fxq 'transfer=prime2-gpu-copy' \
            || {
              echo "Missing Clover Firefox DMABUF synchronization marker" >&2
              exit 1
            }

          #
          # Validate systemd
          #
          grep -Eq \
            '^(usr/bin/systemd|usr/lib/systemd/systemd)$' \
            rootfs-files.txt \
            || {
              echo "systemd executable is missing" >&2
              exit 1
            }

          #
          # IMPORTANT:
          #
          # Do NOT hard-code:
          #
          #   ./etc/droidspaces-systemd257
          #
          # here.
          #
          # tar_cat automatically resolves whether the archive uses
          # "./etc/..." or "etc/...".
          #
          marker="$(
            tar_cat \
              etc/droidspaces-systemd257
          )"

          printf '%s\n' "$marker" \
            | grep -Fxq \
              'patchset=0001-droidspaces-kernel-4.4-compat.patch' \
            || {
              echo "Wrong or missing Droidspaces systemd patchset marker" >&2
              exit 1
            }

          printf '%s\n' "$marker" \
            | grep -Fxq \
              'source_commit=70b5d110be7702afc4dbce012f60d49506d513da' \
            || {
              echo "Unexpected systemd source commit" >&2
              exit 1
            }

          printf '%s\n' "$marker" \
            | grep -Eq \
              '^installed_version=systemd 257([[:space:]]|$)' \
            || {
              echo "Expected systemd 257 is not installed" >&2
              exit 1
            }

          #
          # Validate Plasma autostart service
          #
          tar_cat \
            etc/systemd/system/mi-pad4-desktop.service \
            | grep -Fxq \
              'ExecStart=/usr/local/bin/mi-pad4-start-wayland' \
            || {
              echo "mi-pad4-desktop.service has an invalid ExecStart" >&2
              exit 1
            }

          #
          # Validate default user
          #
          if ! grep -Fxq \
              'home/user' \
              rootfs-files.txt
          then
            grep -q \
              '^home/user/' \
              rootfs-files.txt \
              || {
                echo "Missing /home/user" >&2
                exit 1
              }
          fi

          #
          # Snap / snapd must not exist
          #
          if grep -Eq \
              '(^|/)(snap|snapd)(/|$)' \
              rootfs-files.txt
          then
            echo "Unexpected snap/snapd files found in RootFS" >&2
            grep -E \
              '(^|/)(snap|snapd)(/|$)' \
              rootfs-files.txt \
              >&2 \
              || true
            exit 1
          fi

          # Android IME is bridged directly by Anland. A second Linux IME wastes
          # RAM/storage and can steal Wayland text-input focus.
          if grep -Eq \
              '^var/lib/pacman/local/(fcitx5($|-)|libime-)' \
              rootfs-files.txt
          then
            echo "Unexpected Linux input-method packages found in RootFS" >&2
            exit 1
          fi

          #
          # Create release checksum
          #
          (
            cd release_assets
            sha256sum "$final" > SHA256SUMS
          )

          #
          # Copy Mi Pad 4 configuration
          #
          cp \
            scripts/mi-pad4/container.config \
            release_assets/mi-pad4-container.config

          cp \
            scripts/mi-pad4/sepolicy.rule \
            release_assets/mi-pad4-sepolicy.rule

          cp \
            scripts/mi-pad4/README.txt \
            release_assets/README.txt

          #
          # Device profile
          #
          cat > release_assets/mi-pad4-kernel-profile.txt <<'EOF'
          device=xiaomi-mi-pad-4-clover
          architecture=aarch64
          kernel=4.4
          kernel_features=KSU,ReKSU,VGEM,DRM,KGSL
          desktop=Arch-Plasma-${{ inputs.profile }}
          display=Anland-Wayland
          gpu=KGSL-legacy-ION-shim
          audio=Anland
          input=Android-IME
          locale=zh_CN.UTF-8
          default_user=user
          systemd_compat=257-pid1-droidspaces
          EOF

          echo
          echo "=============================================="
          echo "RootFS validation completed successfully"
          echo "=============================================="
          echo "Archive: $rootfs_archive"
          echo
          ls -lh "$rootfs_archive"
          echo
          cat release_assets/SHA256SUMS

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: arch-mi-pad4-${{ inputs.profile }}
          path: release_assets/
          if-no-files-found: error
          retention-days: 30

      - name: Publish release
        if: ${{ inputs.publish_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: arch-mi-pad4-${{ inputs.profile }}-v${{ github.run_number }}
          name: Arch Mi Pad 4 ${{ inputs.profile }} RootFS v${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: false
          make_latest: true
          files: release_assets/*
          body: |
            Arch Linux ARM aarch64 RootFS for Xiaomi Mi Pad 4 clover.

            Profile: ${{ inputs.profile }}.

            Uses systemd 257 as PID 1 with the Droidspaces cgroup/sandbox
            compatibility patch for the Android 4.4 kernel.

            Display: Anland Wayland
            GPU: KGSL + legacy ION shim
            Audio: Anland
            Input: Android IME
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
