name: Build Arch Mi Pad 4 RootFS

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Desktop profile
        required: true
        type: choice
        default: min
        options:
          - min
      publish_release:
        description: Publish this build to GitHub Releases
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: arch-mi-pad4-${{ inputs.profile }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build patched Mesa for KGSL
        shell: bash
        env:
          PANGO_PKG_COMMIT: 92547f34a91108b16e6dd2ea08317e0bd1be7487
        run: |
          set -euo pipefail
          rm -rf .ci/archlinuxarm-PKGBUILDs .ci/pango mesa-mi-pad4 local-packages-mi-pad4
          git clone --depth 1 --branch freedreno \
            https://github.com/E7G/archlinuxarm-PKGBUILDs.git \
            .ci/archlinuxarm-PKGBUILDs
          git clone --filter=blob:none --no-checkout \
            https://gitlab.archlinux.org/archlinux/packaging/packages/pango.git \
            .ci/pango
          git -C .ci/pango fetch --depth 1 origin "$PANGO_PKG_COMMIT"
          git -C .ci/pango checkout --detach FETCH_HEAD
          docker run --privileged --rm \
            -v "$PWD/.ci/archlinuxarm-PKGBUILDs:/src" \
            -v "$PWD/.ci/pango:/pango" \
            lfdevs/archlinuxarm:base-devel bash -lc '
              set -euo pipefail
              pacman -Syyu --noconfirm
              pacman -S --needed --noconfirm sudo base-devel git ccache
              useradd -m -s /bin/bash builder
              echo "builder ALL=(ALL) NOPASSWD: ALL" >/etc/sudoers.d/builder
              chmod 0440 /etc/sudoers.d/builder
              chown -R builder:builder /src /pango
              sudo -u builder bash -lc "
                export CCACHE_DIR=/home/builder/.ccache
                ccache --max-size=2G
                cd /src/extra/mesa
                makepkg -s --noconfirm --needed
                cd /pango
                makepkg -sA --noconfirm --needed
              "
            '
          mkdir -p mesa-mi-pad4
          for pattern in \
            'mesa-[0-9]*.pkg.tar.*' \
            'vulkan-freedreno-*.pkg.tar.*' \
            'vulkan-mesa-implicit-layers-*.pkg.tar.*'; do
            cp -v .ci/archlinuxarm-PKGBUILDs/extra/mesa/$pattern mesa-mi-pad4/
          done
          test -n "$(find mesa-mi-pad4 -maxdepth 1 -name 'mesa-*.pkg.tar.*' -print -quit)"
          sha256sum mesa-mi-pad4/*.pkg.tar.* | tee mesa-mi-pad4/SHA256SUMS
          mkdir -p local-packages-mi-pad4
          cp -v .ci/pango/pango-[0-9]*.pkg.tar.* local-packages-mi-pad4/
          test -n "$(find local-packages-mi-pad4 -maxdepth 1 -name 'pango-*.pkg.tar.*' -print -quit)"
          sha256sum local-packages-mi-pad4/*.pkg.tar.* | tee local-packages-mi-pad4/SHA256SUMS

      - name: Build Arch rootfs
        shell: bash
        env:
          PROFILE: ${{ inputs.profile }}
        run: |
          set -euo pipefail
          chmod +x build_rootfs-qemu-aarch64.sh
          ./build_rootfs-qemu-aarch64.sh \
            -i Arch-KDE.Dockerfile \
            -v "mi-pad4-${PROFILE}-${GITHUB_RUN_NUMBER}" \
            -K "${PROFILE}" \
            -L false \
            -P none \
            -g true \
            -a false \
            -b true \
            -c true \
            -d false \
            -e true \
            -f false \
            -h true \
            -j false \
            -n true \
            -S true \
            -t false \
            -u user \
            -A true \
            -M true

      - name: Validate rootfs
        shell: bash
        run: |
          set -euo pipefail
          archive="$(find . -maxdepth 1 -name 'Arch-KDE-Wayland-Droidspaces-rootfs-aarch64-*.tar.xz' -print -quit)"
          test -n "$archive"
          mkdir -p release_assets
          final="Arch-${{ inputs.profile }}-Anland-MiPad4-aarch64-v${GITHUB_RUN_NUMBER}.tar.xz"
          mv "$archive" "release_assets/$final"
          tar -tf "release_assets/$final" | sed 's#^\./##' > rootfs-files.txt
          grep -Eq '^(sbin|usr/bin)/droidspaces-init$' rootfs-files.txt || { echo "Missing droidspaces-init" >&2; exit 1; }
          for path in \
            usr/local/bin/mi-pad4-start-wayland \
            etc/droidspaces-systemd257 \
            etc/systemd/system/mi-pad4-desktop.service \
            etc/systemd/system/multi-user.target.wants/mi-pad4-desktop.service \
            usr/local/bin/dolphin \
            usr/local/bin/mi-pad4-firefox \
            usr/local/lib/libion-legacy-shim.so \
            usr/local/lib/firefox-vaapi/libva-drm.so.2 \
            usr/lib/dri/v4l2_drv_video.so \
            usr/lib/firefox/glxtest \
            usr/lib/firefox/glxtest.real \
            usr/bin/startplasma-wayland \
            usr/bin/kwin_wayland; do
            grep -Fxq "$path" rootfs-files.txt || { echo "Missing $path" >&2; exit 1; }
          done
          grep -Fxq 'usr/share/droidspaces/anland-kwin-package' rootfs-files.txt
          grep -Fxq 'usr/share/droidspaces/kio-runtime-named-socket' rootfs-files.txt
          grep -Fxq 'usr/share/droidspaces/mesa-kgsl-dmabuf-import' rootfs-files.txt
          grep -Eq '^var/lib/pacman/local/mesa-1:26\.2\.0-9/' rootfs-files.txt
          grep -Eq '^var/lib/pacman/local/pango-1:1\.58\.2-1/' rootfs-files.txt
          grep -Eq '^(usr/bin/systemd|usr/lib/systemd/systemd)$' rootfs-files.txt
          marker="$(tar -xOf "release_assets/$final" ./etc/droidspaces-systemd257)"
          printf '%s\n' "$marker" | grep -Fxq 'patchset=0001-droidspaces-kernel-4.4-compat.patch'
          printf '%s\n' "$marker" | grep -Fxq 'source_commit=70b5d110be7702afc4dbce012f60d49506d513da'
          printf '%s\n' "$marker" | grep -Eq '^installed_version=systemd 257([[:space:]]|$)'
          tar -xOf "release_assets/$final" ./etc/systemd/system/mi-pad4-desktop.service | \
            grep -Fxq 'ExecStart=/usr/local/bin/mi-pad4-start-wayland'
          grep -Fxq 'home/user' rootfs-files.txt || grep -q '^home/user/' rootfs-files.txt
          ! grep -Eq '(^|/)(snap|snapd)(/|$)' rootfs-files.txt
          (cd release_assets && sha256sum "$final" > SHA256SUMS)
          cp scripts/mi-pad4/container.config release_assets/mi-pad4-container.config
          cp scripts/mi-pad4/sepolicy.rule release_assets/mi-pad4-sepolicy.rule
          cp scripts/mi-pad4/README.txt release_assets/README.txt
          cat > release_assets/mi-pad4-kernel-profile.txt <<'EOF'
          device=xiaomi-mi-pad-4-clover
          architecture=aarch64
          kernel=4.4
          kernel_features=KSU,ReKSU,VGEM,DRM,KGSL
          desktop=Arch-Plasma-${{ inputs.profile }}
          display=Anland-Wayland
          gpu=KGSL-legacy-ION-shim
          audio=Anland
          input=Fcitx5-Pinyin
          locale=zh_CN.UTF-8
          default_user=user
          systemd_compat=257-pid1-droidspaces
          EOF

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: arch-mi-pad4-${{ inputs.profile }}
          path: release_assets/
          if-no-files-found: error
          retention-days: 30

      - name: Publish release
        if: ${{ inputs.publish_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: arch-mi-pad4-${{ inputs.profile }}-v${{ github.run_number }}
          name: Arch Mi Pad 4 ${{ inputs.profile }} RootFS v${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: false
          make_latest: true
          files: release_assets/*
          body: |
            Arch Linux ARM aarch64 RootFS for Xiaomi Mi Pad 4 clover.
            Profile: ${{ inputs.profile }}.
            Uses systemd 257 as PID 1 with the Droidspaces cgroup/sandbox
            compatibility patch for the Android 4.4 kernel. Display is Anland
            Wayland, GPU path is KGSL + legacy ION shim.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
